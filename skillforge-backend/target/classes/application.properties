# SkillForge Backend

## Application Properties
spring.application.name=skillforge-backend
server.port=8081

## Database Configuration (H2 In-Memory - for development)
## Switch to PostgreSQL for production
spring.datasource.url=jdbc:postgresql://localhost:5432/skillforge
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=Narayana
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

## JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

## JWT Configuration
app.jwt.secret=skillforge-secret-key-change-in-production-make-it-at-least-256-bits-long
app.jwt.expiration=86400000
app.jwt.refresh-expiration=2592000000

## Password Reset
app.reset.token-expiration-minutes=30
app.reset.return-token=true

## CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000

## Logging
logging.level.com.skillforge=DEBUG
logging.level.org.springframework.security=DEBUG

